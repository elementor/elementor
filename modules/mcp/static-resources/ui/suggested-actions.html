<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background: #fafafa;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #EDE7F6;
    color: #5E35B1;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    transition: background 0.15s;
  }
  .chip:hover { background: #D1C4E9; }
  .chip svg { flex-shrink: 0; width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
<div id="container"></div>
<script>
(function() {
  var ICONS = {
    sparkles: '<svg viewBox="0 0 24 24"><path d="M12 0l1.2 3.6L17 5l-3.8 1.2L12 10l-1.2-3.8L7 5l3.8-1.4L12 0zm0 14l1.2 3.6L17 19l-3.8 1.2L12 24l-1.2-3.8L7 19l3.8-1.4L12 14z"/></svg>',
    grid: '<svg viewBox="0 0 24 24"><path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zM3 14h7v7H3v-7zm11 0h7v7h-7v-7z"/></svg>',
    branch: '<svg viewBox="0 0 24 24"><path d="M6 3v6c0 1.1.9 2 2 2h3v2H7c-2.21 0-4 1.79-4 4v1h2v-1c0-1.1.9-2 2-2h4c1.1 0 2-.9 2-2V5h2V3H6zm14 0v6c0 1.1-.9 2-2 2h-3v2h3c2.21 0 4 1.79 4 4v1h-2v-1c0-1.1-.9-2-2-2h-4c-1.1 0-2-.9-2-2V5h-2V3h4z"/></svg>'
  };

  var msgId = 2;
  var container = document.getElementById('container');

  function send(msg) {
    window.parent.postMessage(JSON.stringify(msg), '*');
  }

  function notifySize() {
    send({
      jsonrpc: '2.0',
      method: 'ui/notifications/size-changed',
      params: { height: container.offsetHeight + 24 }
    });
  }

  function sendUserMessage(text) {
    send({
      jsonrpc: '2.0',
      id: msgId++,
      method: 'ui/message',
      params: { role: 'user', content: { type: 'text', text: text } }
    });
  }

  function parseActions(params) {
    // tool-result: structured data optimized for UI rendering.
    if (params.structuredContent && params.structuredContent.actions) {
      return params.structuredContent.actions;
    }
    // tool-input: the tool arguments themselves. Per the MCP Apps spec this
    // notification is guaranteed and arrives before tool-result, so an inline
    // widget must render from it too, otherwise the container stays empty.
    if (params.arguments && params.arguments.actions) {
      return params.arguments.actions;
    }
    // tool-result text fallback for hosts that only forward content items.
    if (params.content && params.content[0] && params.content[0].text) {
      try {
        var parsed = JSON.parse(params.content[0].text);
        return parsed.actions || parsed;
      } catch (e) { /* ignore */ }
    }
    return [];
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderActions(actions) {
    container.innerHTML = '';
    actions.forEach(function(action) {
      var btn = document.createElement('button');
      btn.className = 'chip';
      var icon = action.icon && ICONS[action.icon] ? ICONS[action.icon] : '';
      btn.innerHTML = icon + '<span>' + escapeHtml(action.label) + '</span>';
      btn.addEventListener('click', function() {
        sendUserMessage(action.prompt);
      });
      container.appendChild(btn);
    });
    notifySize();
  }

  window.addEventListener('message', function(event) {
    var data;
    try {
      data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    } catch (e) { return; }
    if (!data || data.jsonrpc !== '2.0') { return; }

    if (data.id === 1 && data.result !== undefined) {
      send({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} });
    }

    if (
      data.method === 'ui/notifications/tool-result' ||
      data.method === 'ui/notifications/tool-input'
    ) {
      renderActions(parseActions(data.params || {}));
    }
  });

  send({ jsonrpc: '2.0', id: 1, method: 'ui/initialize', params: {} });
})();
</script>
</body>
</html>
