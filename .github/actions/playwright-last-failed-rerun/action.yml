name: Playwright last-failed on Actions re-run
description: Restore per-shard Playwright last-run state when github.run_attempt is greater than 1.

inputs:
  shard-index:
    description: Matrix shard identifier for this job.
    required: true
  browser:
    description: Browser label used in artifact names (for example chromium or all).
    required: true
  is-actions-rerun:
    description: Whether this workflow run is a GitHub Actions re-run (run_attempt > 1).
    required: true

runs:
  using: composite
  steps:
    - name: Skip last-failed restore on first attempt
      if: inputs.is-actions-rerun != 'true'
      shell: bash
      run: echo "First workflow attempt; running the full shard test selection."

    - name: Download Playwright last-run state from prior attempt
      if: inputs.is-actions-rerun == 'true'
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: playwright-last-run-${{ inputs.shard-index }}-${{ inputs.browser }}
        path: .github/artifacts/playwright-last-run

    - name: Apply Playwright last-failed arguments
      if: inputs.is-actions-rerun == 'true'
      shell: bash
      env:
        SHARD_INDEX: ${{ inputs.shard-index }}
      run: |
        set -euo pipefail
        if bash .github/scripts/playwright-last-run-state.sh restore-for-rerun "$SHARD_INDEX"; then
          echo "PLAYWRIGHT_LAST_FAILED_ARGS=--last-failed" >> "$GITHUB_ENV"
          echo "Playwright will run only tests that failed in the previous attempt for this shard." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Last-run state was not restored; running the full shard test selection." >> "$GITHUB_STEP_SUMMARY"
        fi
