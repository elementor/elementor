name: Install Playwright browsers
description: Restores Playwright browsers from cache, or installs them on a cache miss

inputs:
  browsers:
    description: Space-separated browser names (e.g. chromium, or chromium firefox webkit)
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('@playwright/test/package.json').version")"
        browsers_key="$(echo "${{ inputs.browsers }}" | tr ' ' '-')"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "browsers_key=${browsers_key}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.browsers_key }}

    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}

    - name: Install Playwright OS dependencies
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps ${{ inputs.browsers }}
