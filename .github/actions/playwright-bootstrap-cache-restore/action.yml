name: Restore Playwright bootstrap caches
description: Restore-only non-plugin Playwright bootstrap caches for shard jobs (Core).

runs:
  using: composite
  steps:
    - name: Cache Docker images
      uses: ScribeMD/docker-cache@0.5.0
      with:
        key: docker-${{ runner.os }}-${{ hashFiles('tests/playwright/.playwright-wp-lite-env.json') }}

    - name: Restore WordPress theme cache
      uses: actions/cache/restore@v5
      id: theme-cache
      with:
        path: hello-elementor
        key: core-pw-theme-v1-${{ runner.os }}

    - name: Compute Playwright templates cache hash
      id: templates-cache-hash
      shell: bash
      run: bash .github/scripts/compute-playwright-templates-cache-hash.sh

    - name: Restore Playwright templates cache
      uses: actions/cache/restore@v5
      id: templates-cache
      with:
        path: templates
        key: core-pw-templates-v1-${{ runner.os }}-${{ steps.templates-cache-hash.outputs.templates_cache_hash }}

    - name: Restore Playwright browsers cache
      uses: actions/cache/restore@v5
      id: browsers-cache
      with:
        path: ~/.cache/ms-playwright
        key: core-pw-browsers-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Download WordPress theme from wordpress.org
      if: steps.theme-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -L --output hello-elementor.zip "https://downloads.wordpress.org/theme/hello-elementor.zip"
        unzip hello-elementor
        rm -f hello-elementor.zip

    - name: Prepare Playwright templates
      if: steps.templates-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm run setup-templates
