name: 'Install npm and Composer Dependencies'
description: 'A composite action to install npm packages and Composer dependencies.'

runs:
  using: 'composite'
  steps:
    - name: Mask GitHub token
      shell: bash
      run: echo "::add-mask::${{ github.token }}"
    - name: Setup PHP 7.4
      id: setup-php
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
    - name: Remove Composer GitHub OAuth token
      shell: bash
      run: composer config --global --unset github-oauth.github.com || true
    - name: Restore dependency cache
      uses: actions/cache@v5
      id: deps-cache
      with:
        path: |
          node_modules
          packages/node_modules
          vendor
        key: deps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'composer.lock') }}
    - name: Install dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm run install:ci
        npm run composer:no-dev
