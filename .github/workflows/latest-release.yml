name: Automated Latest Release

env:
  CHANNEL: 'latest'
  PRERELEASE: 'false'

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - release/beta
      - release/stable
      - '[0-9].[0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      target_branch:
        type: choice
        description: Branch to build and release from.
        required: true
        default: main
        options:
          - main
          - release/beta
          - release/stable
          - other
      custom_branch:
        type: string
        description: Branch name, used only when target_branch is "other".
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# Cancel in-progress jobs or runs for the current workflow run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest_release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip release' ))
    runs-on: ubuntu-22.04
    env:
      # Branch being released. A manual run picks it from the inputs, a merge takes the PR base.
      RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.custom_branch != '' && inputs.custom_branch || inputs.target_branch) || github.event.pull_request.base.ref }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
      - name: Get Configuration
        id: configuration
        uses: rgarcia-phi/json-to-variables@9835d537368468c4e4de5254dc3efeadda183793
        with:
          filename: './.github/workflows/config.json'
          prefix: config
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Set POSTFIX value
        id: set_postfix_value
        uses: ./.github/workflows/set-postfix-value
        with:
          PRERELEASE: ${{ env.PRERELEASE }}
      - name: Env Vars Configure
        id: env_vars_configure
        uses: ./.github/workflows/env-vars-configure
        with:
          CHANNEL: ${{ env.CHANNEL }}
          REF: ${{ github.event_name == 'workflow_dispatch' && env.RELEASE_BRANCH || github.ref }}
          POSTFIX: ${{ steps.set_postfix_value.outputs.postfix }}
      - name: Bump Channel Version
        id: bump_channel_version
        uses: ./.github/workflows/bump-channel-version
        with:
          CLEAN_PACKAGE_VERSION: ${{ env.CLEAN_PACKAGE_VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
          POSTFIX: ${{ steps.set_postfix_value.outputs.postfix }}
          OVERRIDE_PACKAGE_VERSION: true
      - name: Install Dependencies
        uses: ./.github/workflows/install-dependencies
      - name: Build plugin
        uses: ./.github/workflows/build-plugin
        with:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          BUILD_SCRIPT_PATH: "./.github/scripts/build-zip.sh"
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          target_commitish: ${{ env.CLEAN_REF }}
          files: elementor-*.zip
          body: "Automated release for ${{ env.PACKAGE_VERSION }}"
          prerelease: ${{ env.PRERELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # The nightly steps continue on error so a rolling-build regression cannot fail a
      # release that already published. They report separately to Slack below.
      - name: Prepare nightly release
        id: nightly
        continue-on-error: true
        uses: elementor/elementor-editor-github-actions/actions/publish-nightly-release@main
        with:
          plugin-slug: elementor
          plugin-zip: ${{ env.PLUGIN_ZIP_FILENAME }}
          package-version: ${{ env.PACKAGE_VERSION }}
          clean-package-version: ${{ env.CLEAN_PACKAGE_VERSION }}
          base-ref: ${{ env.RELEASE_BRANCH }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-url: ${{ github.event.pull_request.html_url }}
          merge-commit-sha: ${{ github.event.pull_request.merge_commit_sha }}
          triggered-by: ${{ github.actor }}
      - name: Update nightly release
        id: update_nightly
        continue-on-error: true
        if: steps.nightly.outcome == 'success'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          tag_name: ${{ steps.nightly.outputs.tag }}
          target_commitish: ${{ env.RELEASE_BRANCH }}
          name: ${{ steps.nightly.outputs.release-name }}
          files: ${{ steps.nightly.outputs.zip }}
          body_path: ${{ steps.nightly.outputs.notes }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post To Slack Created Latest auto Release
        if: ${{ github.event.inputs.pre_release }} == false
        uses: ./.github/workflows/post-to-slack
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_TAG_CHANNELS: ${{ secrets.LATEST_HOSTING_RELEASE_CHANNAL_ID }}
          PAYLOAD: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Hi All :smile:\n\nWe just Published Latest release of *Elementor*\n`${{ env.PACKAGE_VERSION }}`"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "GitHub Release *${{ env.PACKAGE_VERSION }}* \nCreated by ${{ github.actor }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open :point_left:",
                      "emoji": true
                    },
                    "value": "open-release",
                    "url": "https://github.com/${{ github.repository }}/releases/tag/${{ env.PACKAGE_VERSION }}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
      - name: Post To Slack Failed Latest auto Release
        if: failure() && vars.RELEASE_FAILURE_CHANNEL_ID != '' && steps.create_release.outcome != 'success'
        uses: ./.github/workflows/post-to-slack
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_TAG_CHANNELS: ${{ vars.RELEASE_FAILURE_CHANNEL_ID }}
          PAYLOAD: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Elementor* automated release from `${{ env.RELEASE_BRANCH }}` failed.\n\nNo new build was published for this run."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ github.event_name == 'workflow_dispatch' && format('Manual run by {0}', github.actor) || format('Merged PR <{0}|#{1}> by {2}', github.event.pull_request.html_url, github.event.pull_request.number, github.actor) }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open run :point_left:",
                      "emoji": true
                    },
                    "value": "open-failed-run",
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
      - name: Post To Slack Failed Nightly Release
        if: always() && vars.RELEASE_FAILURE_CHANNEL_ID != '' && (steps.nightly.outcome == 'failure' || steps.update_nightly.outcome == 'failure')
        uses: ./.github/workflows/post-to-slack
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_TAG_CHANNELS: ${{ vars.RELEASE_FAILURE_CHANNEL_ID }}
          PAYLOAD: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Elementor* nightly build from `${{ env.RELEASE_BRANCH }}` failed to update.\n\nRelease `${{ env.PACKAGE_VERSION }}` was published, but the nightly release still points at the previous build."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ github.event_name == 'workflow_dispatch' && format('Manual run by {0}', github.actor) || format('Merged PR <{0}|#{1}> by {2}', github.event.pull_request.html_url, github.event.pull_request.number, github.actor) }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "Open run :point_left:",
                      "emoji": true
                    },
                    "value": "open-failed-nightly-run",
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
