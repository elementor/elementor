name: CI Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CI_DISPATCH_APP_KEY }}
          owner: elementor
          repositories: elementor-editor-github-actions-internal

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api repos/elementor/elementor-editor-github-actions-internal/dispatches \
            -f event_type=ci-sync \
            -F "client_payload[pr]=$PR" -f "client_payload[sha]=$SHA"
