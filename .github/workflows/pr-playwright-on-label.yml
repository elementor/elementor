name: PR Playwright on Label

on:
  pull_request:
    types: [labeled]
    branches:
      - main
      - '[0-9].[0-9][0-9]'

concurrency:
  group: pr-${{ github.event.pull_request.number }}-playwright-label
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    if: |
      startsWith(github.repository, 'elementor/') &&
      (github.event.label.name == 'run-tests' || github.event.label.name == 'full-browser-compatibility') &&
      !github.event.pull_request.draft
    outputs:
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            playwright:
              - 'tests/playwright/**'
              - 'tests/elements-regression/**'
              - '.github/actions/playwright-**'
              - '.github/workflows/playwright-**'
              - 'packages/**'
              - 'modules/**'
              - 'core/**'
              - 'license/**'
              - 'assets/**'
              - '*.php'
              - 'package*.json'
              - 'composer.+(json|lock)'

  install:
    name: Install dependencies
    needs: [detect-changes]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: composer config --global --unset github-oauth.github.com || true
      - uses: ./.github/workflows/install-dependencies

  build:
    name: Build plugin
    needs: [install]
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.set_outputs.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Set ENV variables
        run: |
          DATE_VERSION=$(date '+%Y%m%d.%H%M')
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION=${VERSION}-${DATE_VERSION}
          PLUGIN_FOLDER_FILENAME="elementor-${PACKAGE_VERSION}"
          echo "DATE_VERSION=$DATE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PLUGIN_FOLDER_FILENAME=$PLUGIN_FOLDER_FILENAME" >> $GITHUB_ENV
      - uses: ./.github/actions/restore-dependencies-cache
        with:
          fail-on-cache-miss: 'true'
      - uses: ./.github/workflows/build-plugin
        with:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          BUILD_SCRIPT_PATH: './.github/scripts/build-zip.sh'
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
      - name: Set build outputs
        id: set_outputs
        run: echo "artifact_name=${PLUGIN_FOLDER_FILENAME}" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_FOLDER_FILENAME: ${{ env.PLUGIN_FOLDER_FILENAME }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_FOLDER_FILENAME }}
          path: elementor
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

  playwright:
    name: Playwright
    needs: [detect-changes, build]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.build.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    uses: ./.github/workflows/playwright-suite.yml
    with:
      build_artifact_name: ${{ needs.build.outputs.artifact_name }}
      pull_request_number: ${{ github.event.pull_request.number }}
