name: TMP - Test Jira Slack Release Announcement

on:
  push:
    branches:
      - ED-25187-test-jira-slack-release-announcement
  workflow_dispatch:
    inputs:
      channel:
        required: true
        type: choice
        description: Channel to simulate.
        options:
          - ga
          - beta
        default: ga
      release_version:
        required: true
        type: string
        description: 'Version to look up as a Jira fixVersion, e.g. 4.2.2'
        default: '4.2.2'

jobs:
  test-announcement:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout branch
        uses: actions/checkout@v6

      - name: Get Jira release URL
        id: get_jira_release_url
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/get-jira-release-url.sh"

      - name: Prepare Slack release announcement
        id: prepare_slack_announcement
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASED_BY: ${{ github.actor }}
          SLACK_RELEASE_ANNOUNCEMENT_COPY: ${{ vars.SLACK_RELEASE_ANNOUNCEMENT_COPY }}
          JIRA_RELEASE_URL: ${{ steps.get_jira_release_url.outputs.jira_release_url }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/prepare-slack-release-announcement.sh"

      - name: Mark payload as a test
        id: mark_as_test
        env:
          PAYLOAD: ${{ steps.prepare_slack_announcement.outputs.payload }}
        run: |
          TEST_PAYLOAD=$(echo "$PAYLOAD" | jq -c \
            '.blocks = [
              {
                "type": "context",
                "elements": [
                  { "type": "mrkdwn", "text": "🧪 *TEST MESSAGE* — verifying ED-25187 (release_line hidden without Jira link). Safe to ignore." }
                ]
              }
            ] + .blocks')
          {
            echo 'payload<<EOF'
            echo "$TEST_PAYLOAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post To Slack
        uses: ./.github/workflows/post-to-slack
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_TAG_CHANNELS: ${{ secrets.TEST_AUTOMATION_RESULTS }}
          PAYLOAD: ${{ steps.mark_as_test.outputs.payload }}
