name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: 'Existing tag/version to build and publish (e.g. 4.2.3)'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Mark as pre-release on GitHub (skips the entire publish workflow — no WordPress.org SVN, Slack, or npm packages publish)'
      channel:
        required: false
        type: choice
        options:
          - stable
          - beta
        default: 'stable'
        description: 'Release channel. Controls the npm dist-tag.'

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      channel:
        required: false
        type: string
        default: 'stable'
    secrets:
      MIXPANEL_TOKEN:
        required: false
      SVN_USERNAME:
        required: false
      SVN_PASSWORD:
        required: false
      SLACK_TOKEN:
        required: false
      SLACK_CHANNEL_RELEASE:
        required: false
      JIRA_API_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false
      NPMJS_CLOUD_DEVOPS_TOKEN:
        required: false
      MAINTAIN_TOKEN:
        required: false
      ELEMENTOR_SITE_CHANGELOG_CACHE_INVALIDATE_API_KEY:
        required: false
    outputs:
      CLEAN_PACKAGE_VERSION:
        description: 'Base semver version with no channel suffix, e.g. 4.2.0'
        value: ${{ jobs.publish.outputs.CLEAN_PACKAGE_VERSION }}
      VERSION_SUFFIX:
        description: 'Channel suffix, e.g. beta1. Empty for stable.'
        value: ${{ jobs.publish.outputs.VERSION_SUFFIX }}
      NPM_TAG:
        description: 'npm dist-tag: latest for stable, the channel name otherwise.'
        value: ${{ jobs.publish.outputs.NPM_TAG }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Builds the plugin from an existing tagged commit and publishes the
  # release. Assumes the tag already exists (created by release-tag-creation)
  # and version strings are already correct. Safe to re-run on its own if a
  # previous publish attempt failed — it does not create or modify the tag.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Build & Publish
    if: ${{ !inputs.prerelease && github.repository_owner == 'elementor' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      REPO_NAME: ${{ github.event.repository.name }}
      VERSION: ${{ inputs.version }}

    outputs:
      CLEAN_PACKAGE_VERSION: ${{ steps.output-data.outputs.CLEAN_PACKAGE_VERSION }}
      VERSION_SUFFIX: ${{ steps.output-data.outputs.VERSION_SUFFIX }}
      NPM_TAG: ${{ steps.output-data.outputs.NPM_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Download built release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.VERSION }}" --pattern "${{ env.REPO_NAME }}-*.zip" --clobber

      - name: Get release name
        uses: ./.github/workflows/get-release-name
        with:
          PLUGIN_NAME: ${{ env.REPO_NAME }}

      - name: Unzip build artifact
        env:
          ELEMENTOR_PATH: ${{ github.workspace }}/${{ env.REPO_NAME }}
          ZIP_FILE: ${{ env.REPO_NAME }}-${{ env.VERSION }}.zip
        run: |
          mkdir -p "$ELEMENTOR_PATH"
          echo "Unzipping ${ZIP_FILE} into ${ELEMENTOR_PATH}"
          unzip -o "$ZIP_FILE" -d "$ELEMENTOR_PATH"

      - name: Validate build files
        if: github.repository_owner == 'elementor'
        env:
          PLUGIN_VERSION: ${{ env.RELEASE_NAME }}
          CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'ga' }}
          PACKAGE_VERSION: ${{ env.VERSION }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/validate-build-files.sh"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: elementor-*.zip
          prerelease: ${{ inputs.prerelease }}
          draft: false

      - name: Publish trunk to WordPress.org SVN
        env:
          PLUGIN_VERSION: ${{ env.RELEASE_NAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'ga' }}
          PACKAGE_VERSION: ${{ env.VERSION }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/publish-to-wordpress-org.sh"

      - name: Copy SVN trunk to tag
        env:
          PLUGIN_VERSION: ${{ env.RELEASE_NAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/copy-svn-trunk-to-tag.sh"

      - name: Invalidate changelog cache
        continue-on-error: true
        uses: elementor/elementor-editor-github-actions/actions/invalidate-changelog-cache@main
        with:
          invalidate_token: ${{ secrets.ELEMENTOR_SITE_CHANGELOG_CACHE_INVALIDATE_API_KEY }}
          product: core
          types: ${{ inputs.channel == 'beta' && 'beta' || 'release' }}

      - name: Get Jira release URL
        id: get_jira_release_url
        env:
          RELEASE_VERSION: ${{ env.RELEASE_NAME }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/get-jira-release-url.sh"

      - name: Prepare Slack release announcement
        id: prepare_slack_announcement
        env:
          CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'ga' }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_NAME }}
          RELEASE_VERSION: ${{ env.RELEASE_NAME }}
          RELEASED_BY: ${{ github.actor }}
          SLACK_RELEASE_ANNOUNCEMENT_COPY: ${{ vars.SLACK_RELEASE_ANNOUNCEMENT_COPY }}
          JIRA_RELEASE_URL: ${{ steps.get_jira_release_url.outputs.jira_release_url }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/prepare-slack-release-announcement.sh"

      - name: Post to Slack
        uses: ./.github/workflows/post-to-slack
        with:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_TAG_CHANNELS: ${{ secrets.SLACK_CHANNEL_RELEASE }}
          PAYLOAD: ${{ steps.prepare_slack_announcement.outputs.payload }}

      - name: Output Package Data for Next Job
        id: output-data
        env:
          PACKAGE_VERSION: ${{ env.RELEASE_NAME }}
        run: |
          # env.RELEASE_NAME is the already-tagged, already-built version
          # (e.g. "4.2.0" or "4.2.0-beta1") — split it into a base semver and
          # an optional channel suffix, the same shape one-click-release.yml
          # produces, so the downstream publish-packages.yml call is a drop-in.
          CLEAN_PACKAGE_VERSION="${PACKAGE_VERSION%%-*}"

          if [ "${{ inputs.channel }}" == "beta" ]; then
            VERSION_SUFFIX="${PACKAGE_VERSION#${CLEAN_PACKAGE_VERSION}-}"
            NPM_TAG="beta"
          else
            VERSION_SUFFIX=""
            NPM_TAG="latest"
          fi

          echo "CLEAN_PACKAGE_VERSION=${CLEAN_PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          echo "NPM_TAG=${NPM_TAG}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────
  # Publishes the packages/ workspace to npm under the same channel as the
  # plugin release (beta → "beta" dist-tag, stable → "latest").
  # ─────────────────────────────────────────────────────────────────────────
  publish-packages:
    name: Publish Packages
    needs: publish
    if: ${{ !inputs.prerelease && github.repository_owner == 'elementor' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      version: ${{ needs.publish.outputs.CLEAN_PACKAGE_VERSION }}
      version_suffix: ${{ needs.publish.outputs.VERSION_SUFFIX }}
      tag: ${{ needs.publish.outputs.NPM_TAG }}
    secrets:
      NPMJS_CLOUD_DEVOPS_TOKEN: ${{ secrets.NPMJS_CLOUD_DEVOPS_TOKEN }}
      MAINTAIN_TOKEN: ${{ secrets.MAINTAIN_TOKEN }}
