name: Test Post-Release Check Call

on:
  push:
    branches:
      - chore/ED-25765-controlled-release-post-check
    paths:
      - .github/workflows/test-post-release-call.yml

jobs:
  post-release-check:
    name: Post-Release Check
    if: github.repository_owner == 'elementor'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/post-release-check.yml
    with:
      core_version: '4.3.5'
    secrets:
      MAINTAIN_TOKEN: ${{ secrets.MAINTAIN_TOKEN }}
