name: Controlled Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: 'Version to release (e.g. 4.2.3 or 4.2.0-beta1)'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Mark as pre-release on GitHub (skips WordPress.org SVN publish)'

permissions:
  contents: write
  id-token: write

jobs:
  # ── Job 1 ────────────────────────────────────────────────────────────────
  # Dry-run: validates version, shows what tag will be created, writes
  # a summary for the reviewer. Nothing is pushed.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate (Dry Run)
    uses: davseve/elementor/.github/workflows/release-tag-creation.yml@split-release-process
    with:
      version: ${{ inputs.version }}
      dry_run: true
    secrets:
      MAINTAIN_USERNAME: ${{ secrets.MAINTAIN_USERNAME }}
      MAINTAIN_EMAIL: ${{ secrets.MAINTAIN_EMAIL }}

  # ── Job 2 ────────────────────────────────────────────────────────────────
  # Approval gate. Reviewer reads the dry-run summary from Job 1 and clicks
  # Approve in the GitHub Actions UI (Settings → Environments → release-approval).
  # environment: cannot be placed on a `uses:` job — this intermediate job
  # holds the gate so Job 3 can use a reusable workflow cleanly.
  # ─────────────────────────────────────────────────────────────────────────
  approve-tag:
    name: Await Approval (Create Tag)
    needs: validate
    environment: release-approval
    runs-on: ubuntu-24.04
    steps:
      - name: Approval received
        run: echo "Tag creation for ${{ inputs.version }} approved. Proceeding."

  # ── Job 3 ────────────────────────────────────────────────────────────────
  # Pushes the version bump commit and the Git tag.
  # ─────────────────────────────────────────────────────────────────────────
  tag:
    name: Create Release Tag
    needs: approve-tag
    uses: davseve/elementor/.github/workflows/release-tag-creation.yml@split-release-process
    with:
      version: ${{ inputs.version }}
      dry_run: false
    secrets:
      MAINTAIN_USERNAME: ${{ secrets.MAINTAIN_USERNAME }}
      MAINTAIN_EMAIL: ${{ secrets.MAINTAIN_EMAIL }}

  # ── Job 4 ────────────────────────────────────────────────────────────────
  # Runs immediately after the tag is pushed (no gate) so the reviewer can
  # see a link to the created tag in the run summary before deciding
  # whether to approve Job 5.
  # ─────────────────────────────────────────────────────────────────────────
  tag-summary:
    name: Tag Created
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - name: Write tag summary
        run: |
          {
            echo "### 🏷️ Tag created: \`${{ inputs.version }}\`"
            echo ""
            echo "[View tag](https://github.com/${{ github.repository }}/tree/${{ inputs.version }})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 5 ────────────────────────────────────────────────────────────────
  # Approval gate. Reviewer confirms the tag/version bump before build & release.
  # ─────────────────────────────────────────────────────────────────────────
  approve-publish:
    name: Await Approval (Publish Release)
    needs: tag-summary
    environment: release-approval
    runs-on: ubuntu-22.04
    steps:
      - name: Approval received
        run: echo "Publish of ${{ inputs.version }} approved. Proceeding."

  # ── Job 6 ────────────────────────────────────────────────────────────────
  # Rollback: runs only if the publish approval was rejected. Deletes the
  # tag (and optionally the version-bump commit) created by Job 3.
  # ─────────────────────────────────────────────────────────────────────────
  cleanup-tag:
    name: Rollback Tag (Rejected)
    needs: approve-publish
    if: always() && needs.approve-publish.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete remote tag
        run: |
          git push origin --delete "${{ inputs.version }}" || echo "Tag already absent"
      - name: Write deletion summary
        run: |
          {
            echo "### 🗑️ Tag \`${{ inputs.version }}\` deleted"
            echo ""
            echo "Publish approval was rejected, so the tag has been removed from the repository."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 7 ────────────────────────────────────────────────────────────────
  # Builds the plugin from the tagged commit and publishes the release.
  # Version strings are already correct — the tag job bumped them.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Build & Publish
    needs: approve-publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        uses: ./.github/workflows/install-dependencies

      - name: Build plugin
        uses: ./.github/workflows/build-plugin
        with:
          PACKAGE_VERSION: ${{ inputs.version }}
          BUILD_SCRIPT_PATH: './.github/scripts/build-zip.sh'
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}

      - name: Get release name
        uses: ./.github/workflows/get-release-name
        with:
          BUILD_ZIP_FILE_PATH: ${{ github.event.repository.name }}-${{ inputs.version }}.zip
          PLUGIN_NAME: ${{ github.event.repository.name }}

      - name: Check changelog is updated
        if: ${{ !inputs.prerelease }}
        uses: ./.github/workflows/verify-version-changelog
        with:
          VERSION: ${{ inputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: elementor-*.zip
          prerelease: ${{ inputs.prerelease }}

      - name: Validate build files
        if: github.repository_owner == 'elementor'
        env:
          PLUGIN_VERSION: ${{ env.RELEASE_NAME }}
          CHANNEL: ${{ inputs.prerelease == true && 'beta' || 'ga' }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/validate-build-files.sh"

