name: Invalidate Changelog Cache

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Changelog product: core or pro.'
        required: true
        type: choice
        options:
          - core
          - pro
      types:
        description: 'Optional space-separated changelog types (release, beta, dev). Overrides channel mapping.'
        required: false
        type: string
        default: ''
      channel:
        description: 'Release channel: ga, stable, beta, or dev. Ignored when types is set.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  invalidate:
    name: Invalidate changelog cache
    if: github.repository_owner == 'elementor'
    runs-on: ubuntu-22.04
    steps:
      - name: Validate inputs
        env:
          INPUT_TYPES: ${{ inputs.types }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$INPUT_TYPES" ] && [ -z "$INPUT_CHANNEL" ]; then
            echo "Error: set types or channel."
            exit 1
          fi

          for TYPE in $INPUT_TYPES; do
            case "$TYPE" in
              release|beta|dev) ;;
              *)
                echo "Error: unsupported type '$TYPE' (allowed: release, beta, dev)."
                exit 1
                ;;
            esac
          done

          case "$INPUT_CHANNEL" in
            ''|ga|stable|beta|dev) ;;
            *)
              echo "Error: unsupported channel '$INPUT_CHANNEL' (allowed: ga, stable, beta, dev)."
              exit 1
              ;;
          esac

      - name: Invalidate changelog cache
        uses: elementor/elementor-editor-github-actions/actions/invalidate-changelog-cache@c9eb200036caeab78a7237c2d7147037e19b236f # main
        with:
          invalidate_token: ${{ secrets.ELEMENTOR_SITE_CHANGELOG_CACHE_INVALIDATE_API_KEY }}
          product: ${{ inputs.product }}
          types: ${{ inputs.types }}
          channel: ${{ inputs.channel }}
