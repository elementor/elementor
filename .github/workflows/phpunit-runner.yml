on:
  workflow_call:
    inputs:
      wordpress_versions:
        required: true
        type: string
      php_versions:
        required: true
        type: string
      job_name:
        required: true
        type: string
      multisite_modes:
        required: false
        type: string
        default: '[false, true]'
      coverage:
        required: false
        type: boolean
        default: false

jobs:
  run-tests:
    runs-on: ubuntu-22.04
    name: ${{ inputs.job_name }} - WP ${{ matrix.wordpress_versions }} - PHP ${{ matrix.php_versions }} - ${{ matrix.multisite && 'Multisite' || 'Single site' }}

    strategy:
      fail-fast: false
      matrix:
        wordpress_versions: ${{ fromJson(inputs.wordpress_versions) }}
        php_versions: ${{ fromJson(inputs.php_versions) }}
        multisite: ${{ fromJson(inputs.multisite_modes) }}

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      COVERAGE: ${{ inputs.coverage && matrix.php_versions >= 8.3 && matrix.wordpress_versions == 'latest' }}
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Mask GitHub token
        run: echo "::add-mask::${{ secrets.GITHUB_TOKEN }}"
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_versions }}
          coverage: none
      - name: Remove Composer GitHub OAuth token
        run: composer config --global --unset github-oauth.github.com || true
      - name: Install Dependencies
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:${{ job.services.mysql.ports['3306'] }} ${{ matrix.wordpress_versions }} true
          composer update --no-interaction
      - name: Run Tests with Coverage (latest PHP & WP)
        if: ${{ !matrix.multisite && env.COVERAGE != 'false' }}
        run: |
          composer run coverage
      - name: Run Tests without Coverage
        if: ${{ !matrix.multisite && env.COVERAGE == 'false' }}
        run: |
          composer run test
      - name: Run Tests - Multisite
        if: ${{ matrix.multisite }}
        run: |
          WP_MULTISITE=1 composer run test
