name: Force Push Beta To Stable

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the PRs in release/stable that are not in release/beta. Do not push.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: force-push-beta-to-stable
  cancel-in-progress: false

jobs:
  force-push-beta-to-stable:
    if: github.repository_owner == 'elementor'
    environment: release-owners
    runs-on: ubuntu-latest

    steps:
      - name: Require GH_PAT for a live push
        if: ${{ !inputs.dry_run }}
        env:
          HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ "$HAS_GH_PAT" != "true" ]; then
            echo "::error::GH_PAT is not set. GITHUB_TOKEN cannot force push release/stable."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ inputs.dry_run && secrets.GITHUB_TOKEN || secrets.GH_PAT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Force push release/beta to release/stable
        uses: elementor/elementor-editor-github-actions/actions/force-push-beta-to-stable@main
        with:
          dry-run: ${{ inputs.dry_run }}
