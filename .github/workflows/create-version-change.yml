name: Create Version Change

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'The next version to set (e.g., 3.20.0). Leave empty to use default (next minor version)'
        required: false
      dry_run:
        type: boolean
        description: 'Run in dry-run mode (show what would be done without making changes)'
        required: false
        default: false
      skip_beta_reset:
        type: boolean
        description: 'Skip resetting release/beta to main (useful for testing version bumps only)'
        required: false
        default: false
      force_beta_reset:
        type: boolean
        description: 'Force reset release/beta even if it has unique commits (downgrades failure to warning)'
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-version-change:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.MAINTAIN_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.MAINTAIN_TOKEN }}
          persist-credentials: true

      - name: Configure git user
        run: |
          git config --global user.name "${{ secrets.MAINTAIN_USERNAME || 'GitHub Actions' }}"
          git config --global user.email "${{ secrets.MAINTAIN_EMAIL || 'github-actions@github.com' }}"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current version
        id: current-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate version and branch names
        id: calculate
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -z "$INPUT_VERSION" ]; then
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0"
          else
            NEXT_VERSION="$INPUT_VERSION"
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          fi

          DEV_BRANCH="version-${NEXT_VERSION}-to-main"

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "dev_branch=$DEV_BRANCH" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION"
          echo "Dev branch: $DEV_BRANCH"

      - name: Build script arguments
        id: build-args
        run: |
          ARGS=""

          VERSION="${{ steps.calculate.outputs.next_version }}"
          ARGS="$ARGS $VERSION"

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ github.event.inputs.skip_beta_reset }}" == "true" ]; then
            ARGS="$ARGS --skip-beta-reset"
          fi

          if [ "${{ github.event.inputs.force_beta_reset }}" == "true" ]; then
            ARGS="$ARGS --force-beta-reset"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Built arguments: $ARGS"

      - name: Run create-version-change script
        id: run-script
        run: |
          node scripts/create-version-change.js --ci ${{ steps.build-args.outputs.args }}

      - name: Check for changes and commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"

          if [ "$CURRENT_BRANCH" != "$DEV_BRANCH" ]; then
            echo "Not on dev branch $DEV_BRANCH, current branch: $CURRENT_BRANCH"
            echo "This might mean the branch already exists or script exited early"
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "Internal: Bump version to ${{ steps.calculate.outputs.next_version }}"

          echo "Changes committed successfully"

      - name: Push branch
        if: github.event.inputs.dry_run != 'true'
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"

          if [ "$CURRENT_BRANCH" != "$DEV_BRANCH" ]; then
            echo "Not on dev branch, skipping push"
            exit 0
          fi

          git push origin "$DEV_BRANCH"
          echo "Branch $DEV_BRANCH pushed successfully"

      - name: Create pull request
        if: github.event.inputs.dry_run != 'true'
        run: |
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"
          NEXT_VERSION="${{ steps.calculate.outputs.next_version }}"

          if gh pr list --head "$DEV_BRANCH" --base main --state open | grep -q .; then
            echo "PR already exists for branch $DEV_BRANCH"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$DEV_BRANCH" \
            --title "chore: bump version to $NEXT_VERSION" \
            --body "This PR bumps the version to **$NEXT_VERSION**.

          **Changes:**
          - Updated version in \`elementor.php\`
          - Updated version in \`package.json\` files
          - Updated version in packages

          **Created by:** GitHub Actions workflow
          **Branch:** \`$DEV_BRANCH\`"

          echo "PR created successfully for $DEV_BRANCH"

      - name: Announce beta branch-out to Slack
        if: success() && github.event.inputs.dry_run != 'true' && steps.run-script.outputs.beta_reset == 'true'
        continue-on-error: true
        env:
          SLACK_BRANCH_OUT_WEBHOOK_URL: ${{ secrets.SLACK_BRANCH_OUT_WEBHOOK_URL }}
          BETA_VERSION: ${{ steps.run-script.outputs.beta_version }}
          MAIN_VERSION: ${{ steps.calculate.outputs.next_version }}
        run: |
          # Exit gracefully if webhook URL is not configured
          if [ -z "$SLACK_BRANCH_OUT_WEBHOOK_URL" ]; then
            echo "Notice: SLACK_BRANCH_OUT_WEBHOOK_URL secret is not set. Skipping Slack notification."
            exit 0
          fi

          # Extract major.minor from versions
          BETA_VERSION_SHORT=$(echo "$BETA_VERSION" | grep -oE '^[0-9]+\.[0-9]+' || echo "")
          MAIN_VERSION_SHORT=$(echo "$MAIN_VERSION" | grep -oE '^[0-9]+\.[0-9]+' || echo "")

          # Validate versions
          if [[ ! "$BETA_VERSION_SHORT" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: Invalid BETA_VERSION format: $BETA_VERSION. Skipping Slack notification."
            exit 0
          fi

          if [[ ! "$MAIN_VERSION_SHORT" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: Invalid MAIN_VERSION format: $MAIN_VERSION. Skipping Slack notification."
            exit 0
          fi

          # Compute stable version (major.minor-1)
          BETA_MAJOR=$(echo "$BETA_VERSION_SHORT" | cut -d. -f1)
          BETA_MINOR=$(echo "$BETA_VERSION_SHORT" | cut -d. -f2)
          
          if [ "$BETA_MINOR" -eq 0 ]; then
            echo "Warning: BETA_MINOR is 0, cannot derive STABLE_VERSION. Skipping Slack notification."
            exit 0
          fi

          STABLE_MINOR=$((BETA_MINOR - 1))
          STABLE_VERSION="${BETA_MAJOR}.${STABLE_MINOR}"

          # Build Slack message
          TEXT="<!channel> :rocket: Beta branch-out is complete!

          Repo: https://github.com/elementor/elementor/

          :package: Version mapping:
          :large_green_circle: release/stable → ${STABLE_VERSION}
          :large_yellow_circle: release/beta → ${BETA_VERSION_SHORT}
          :large_blue_circle: main → ${MAIN_VERSION_SHORT}

          From now on, fixes meant for the ${BETA_VERSION_SHORT} beta need a cherry-pick to release/beta. Everything else lands on main for ${MAIN_VERSION_SHORT}."

          # Build JSON payload with jq
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text:$text}')

          # Post to Slack
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_BRANCH_OUT_WEBHOOK_URL"
          echo "Slack notification sent successfully."

