name: Create Version Change

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'The next version to set (e.g., 3.20.0). Leave empty to use default (next minor version)'
        required: false
      dry_run:
        type: boolean
        description: 'Run in dry-run mode (show what would be done without making changes)'
        required: false
        default: false
      skip_beta_reset:
        type: boolean
        description: 'Skip resetting release/beta to main (useful for testing version bumps only)'
        required: false
        default: false
      force_beta_reset:
        type: boolean
        description: 'Force reset release/beta even if it has unique commits (downgrades failure to warning)'
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-version-change-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard-main-only:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Fail if not run from main
        run: |
          echo "::error::Run this workflow from main"
          exit 1

  create-version-change:
    if: github.ref == 'refs/heads/main'
    environment: release-owners
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.MAINTAIN_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MAINTAIN_TOKEN }}
          persist-credentials: true

      - name: Configure git user
        run: |
          git config --global user.name "${{ secrets.MAINTAIN_USERNAME || 'GitHub Actions' }}"
          git config --global user.email "${{ secrets.MAINTAIN_EMAIL || 'github-actions@github.com' }}"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get current version
        id: current-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate version and branch names
        id: calculate
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -z "$INPUT_VERSION" ]; then
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0"
          else
            NEXT_VERSION="$INPUT_VERSION"
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          fi

          DEV_BRANCH="version-${NEXT_VERSION}-to-main"

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "dev_branch=$DEV_BRANCH" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION"
          echo "Dev branch: $DEV_BRANCH"

      - name: Build script arguments
        id: build-args
        run: |
          ARGS=""

          VERSION="${{ steps.calculate.outputs.next_version }}"
          ARGS="$ARGS $VERSION"

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ github.event.inputs.skip_beta_reset }}" == "true" ]; then
            ARGS="$ARGS --skip-beta-reset"
          fi

          if [ "${{ github.event.inputs.force_beta_reset }}" == "true" ]; then
            ARGS="$ARGS --force-beta-reset"
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Built arguments: $ARGS"

      - name: Run create-version-change script
        id: run-script
        run: |
          node scripts/create-version-change.js --ci ${{ steps.build-args.outputs.args }}

      - name: Check for changes and commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"

          if [ "$CURRENT_BRANCH" != "$DEV_BRANCH" ]; then
            echo "Not on dev branch $DEV_BRANCH, current branch: $CURRENT_BRANCH"
            echo "This might mean the branch already exists or script exited early"
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "Internal: Bump version to ${{ steps.calculate.outputs.next_version }}"

          echo "Changes committed successfully"

      - name: Push branch
        if: github.event.inputs.dry_run != 'true'
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"

          if [ "$CURRENT_BRANCH" != "$DEV_BRANCH" ]; then
            echo "Not on dev branch, skipping push"
            exit 0
          fi

          git push origin "$DEV_BRANCH"
          echo "Branch $DEV_BRANCH pushed successfully"

      - name: Create pull request
        id: create-pr
        if: github.event.inputs.dry_run != 'true'
        run: |
          DEV_BRANCH="${{ steps.calculate.outputs.dev_branch }}"
          NEXT_VERSION="${{ steps.calculate.outputs.next_version }}"

          EXISTING_PR_URL=$(gh pr list --head "$DEV_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR_URL" ]; then
            echo "pr_url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"
            echo "PR already exists for branch $DEV_BRANCH"
            exit 0
          fi

          PR_URL=$(gh pr create \
            --base main \
            --head "$DEV_BRANCH" \
            --title "chore: bump version to $NEXT_VERSION" \
            --body "This PR bumps the version to **$NEXT_VERSION**.

          **Changes:**
          - Updated version in \`elementor.php\`
          - Updated version in \`package.json\` files
          - Updated version in packages

          **Created by:** GitHub Actions workflow
          **Branch:** \`$DEV_BRANCH\`")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR created successfully for $DEV_BRANCH"

      - name: Announce beta branch-out to Slack
        if: ${{ !cancelled() && steps.run-script.outputs.beta_reset == 'true' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        uses: elementor/elementor-editor-github-actions/actions/announce-branch-structure@97f23ce4fad39dd8069f4e82a821cf3cadc2da6c
        with:
          event: beta-branch-out
          slack-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_BRANCH_OUT }}
          beta-version: ${{ steps.run-script.outputs.beta_version }}
          main-version: ${{ steps.calculate.outputs.next_version }}
          bump-pr-outcome: ${{ steps.create-pr.outcome }}

